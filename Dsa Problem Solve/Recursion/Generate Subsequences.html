<body>
    <script>
        function Subsequences(str,index,current){
            if(index === str.length){
                console.log(current);
                return
            }
            Subsequences(str,index+1,current+str[index]);
            Subsequences(str,index+1,current);
        }
        Subsequences("abc",0,"")
    </script>
