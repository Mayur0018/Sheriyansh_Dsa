<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function largestReactngleArea(heights) {
        let stack = [];
        let maxArea = 0;

        for (let i = 0; i <= heights.length; i++) {
          let currentHeight = i === heights.length ? 0 : heights[i];

          while (
            stack.length > 0 &&
            currentHeight < heights[stack[stack.length - 1]]
          ) {
            let height = heights[stack.pop()];
            let width;

            if (stack.length === 0) {
              width = i;
            } else {
              width = i - stack[stack.length - 1] - 1;
            }
            let area = height * width;

            if (area > maxArea) {
              maxArea = area;
            }
          }
              stack.push(i);

        }
        return maxArea;
      }
      console.log(largestReactngleArea([2, 1, 5, 6, 2, 3]));
    </script>
  </body>
</html>
