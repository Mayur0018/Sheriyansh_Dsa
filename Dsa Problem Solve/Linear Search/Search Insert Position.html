<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function serachInsert(arr, target) {
        let left = 0;
        let right = arr.length - 1;

        while (left <= right) {
          let mid = Math.floor((left + right) / 2);

          if (arr[mid] === target) {
            return mid;
          } else if (arr[mid] < target) {
            left = mid + 1;
          } else {
            right = mid - 1;
          }
        }
        return left;
      }
      let arr = [1, 3, 5, 6];
      let target = 2;
      console.log(serachInsert(arr, target));
    </script>
  </body>
</html>
