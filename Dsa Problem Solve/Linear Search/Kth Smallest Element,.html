  <body>
    <script>
      function ksmallest(arr, k) {
        let n = arr.length;
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            if (arr[i] > arr[j]) {
              let temp = arr[i];
              arr[i] = arr[j];
              arr[j] = temp;
            }
          }
        }
        return arr[k - 1];
      }
      console.log(ksmallest([7, 20, 10, 4, 3, 2],1));
    </script>
  </body>
