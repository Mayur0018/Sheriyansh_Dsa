<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function precedence(oprator) {
        if (oprator === "^") return 3;
        if (oprator === "*" || oprator === "/") return 2;
        if (oprator === "+" || oprator === "-") return 1;
        return 0;
      }

      function infixToPostfix(expresion) {
        let stack = [];
        let result = "";

        for (let i = 0; i < expresion.length; i++) {
          let char = expresion[i];
          if (char === " ") {
            continue;
          }
          if (
            (char >= "0" && char <= "9") ||
            (char >= "a" && char <= "z") ||
            (char >= "A" && char <= "Z")
          ) {
            result += char;
          } else if (char === "(") {
            stack.push(char);
          } else if (char === ")") {
            while (stack.length > 0 && stack[stack.length - 1] !== "(") {
              result += stack.pop();
            }
            stack.pop();
          } else {
            while (
              stack.length > 0 &&
              stack[stack.length - 1] !== "(" &&
              precedence(stack[stack.length - 1]) >= precedence(char)
            ) {
              result += stack.pop();
            }
            stack.push(char);
          }
        }
        while (stack.length > 0) {
          result += stack.pop();
        }
        return result;
      }
      console.log(infixToPostfix("2+3*4"));
    </script>
  </body>
</html>
