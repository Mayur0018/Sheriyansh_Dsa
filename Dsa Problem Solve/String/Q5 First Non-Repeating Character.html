<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str = "aaabacaaaccc";
      let frequency = {};

      for (let i = 0; i < str.length; i++) {
        let char = str[i];
        if (frequency[char]) {
          frequency[char]++;
        } else {
          frequency[char] = 1;
        }
      }
      for (let i = 0; i < str.length; i++) {
        let char = str[i];
        if (frequency[char] === 1) {
          console.log(char);
          break;
        }
      }
    </script>
  </body>
</html>
