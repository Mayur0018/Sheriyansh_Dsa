<!DOCTYPE html>

    <title>Document</title>

  <body>
    <script>
      function FindingMising(arr) {
        let n = arr.length + 1;
        let expectedSum = (n * (n + 1)) / 2;
        let actualSum = 0;

        for (let i = 0; i < arr.length; i++) {
          actualSum = actualSum + arr[i];
        }
        return expectedSum - actualSum;
      }
      console.log(FindingMising([1, 2, 4, 5, 6]));
    </script>
  </body>
</html>
