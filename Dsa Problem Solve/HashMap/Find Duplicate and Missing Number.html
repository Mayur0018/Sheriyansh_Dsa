<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function findMisingandDuplicatesNumber(nums) {
        let map = new Map();
        let duplicates = -1;
        let mising = -1;
        for (let i = 0; i < nums.length; i++) {
          let current = nums[i];

          if (map.has(current)) {
            duplicates = current;
          } else {
            map.set(current, 1);
          }
        }

        for (let i = 1; i <= nums.length; i++) {
          if (!map.has(i)) {
            mising = i;
            break;
          }
        }
        return [duplicates, mising];
      }
      console.log(findMisingandDuplicatesNumber([1, 2,2,2, 3, 4, 5]));
    </script>
  </body>
</html>
