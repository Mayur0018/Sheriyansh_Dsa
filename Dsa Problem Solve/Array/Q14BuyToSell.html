<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function maxProfit(price) {
        let minprice = price[0];
        let maxProfit = 0;

        for (let i = 1; i < price.length; i++) {
          let profit = price[i] - minprice;

          if (profit > maxProfit) {
            maxProfit = profit;
          }

          if (price[i] < minprice) {
            minprice = price[i];
          }
        }
        return maxProfit;
      }

      console.log(maxProfit([10, 30, 30, 50]));
    </script>
  </body>
</html>
