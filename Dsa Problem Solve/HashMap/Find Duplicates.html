<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function findDuplicates(nums) {
        let map = new Map();
        let duplicates = [];
        let count = 0;

        for (let i = 0; i < nums.length; i++) {
          if (map.has(nums[i])) {
            duplicates[count] = nums[i];
            count++;
          } else {
            map.set(nums[i], i);
          }
        }
        return duplicates;
      }

      const nums = [1, 2, 3, 4, 5, 6,6,3,2];
      console.log(findDuplicates(nums));
    </script>
  </body>
</html>
