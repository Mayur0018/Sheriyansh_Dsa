<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let prices = [100, 80, 60, 70, 60, 75, 85];
      let span = [];

      for (let i = 0; i < prices.length; i++) {
        let count = 1;

        for (let j = i - 1; j >= 0; j--) {
          if (prices[j] <= prices[i]) {
            count++;
          } else {
            break;
          }
        }
        span.push(count);
      }
      console.log(span);
    </script>
  </body>
</html>
