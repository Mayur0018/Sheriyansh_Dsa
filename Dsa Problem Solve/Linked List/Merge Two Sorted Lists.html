<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      class Node {
        constructor(value) {
          this.value = value;
          this.next = null;
        }
      }

      function mergeTwoList(head1, head2) {
        let dummy = new Node(0);

        let current = dummy;

        while (head1 !== null && head2 !== null) {
          if (head1.value < head2.value) {
            current.next = head1;
            head1 = head1.next;
          } else {
            current.next = head2;
            head2 = head2.next;
          }

          current = current.next;
        }

        if (head1 !== null) {
          current.next = head1;
        }

        if (head2 !== null) {
          current.next = head2;
        }

        return dummy.next;
      }

      // List 1

      let head1 = new Node(1);

      head1.next = new Node(3);

      head1.next.next = new Node(5);

      // List 2

      let head2 = new Node(2);

      head2.next = new Node(4);

      head2.next.next = new Node(6);

      // Merge

      let head = mergeTwoList(head1, head2);

      // Print

      let current = head;

      while (current !== null) {
        console.log(current.value);

        current = current.next;
      }
    </script>
  </body>
</html>
