<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Node {
        constructor(value) {
          this.value = value;
          this.next = null;
        }
      }
      function removeCycle(head) {
        let slow = head;
        let fast = head;

        while (fast !== null && fast.next !== null) {
          slow = slow.next;
          fast = fast.next.next;

          if (slow === fast) {
            break;
          }
        }
        if (fast === null || fast.next === null) {
          return false;
        }
        slow = head;

        while (slow !== fast) {
          slow = slow.next;
          fast = fast.next;
        }

        let cycleNode = slow;

        while (cycleNode.next !== slow) {
          cycleNode = cycleNode.next;
        }
        cycleNode.next = null;
        return true;
      }

      let head = new Node(1);
      head.next = new Node(2);
      head.next.next = new Node(3);
      head.next.next.next = new Node(4);

      head.next.next.next = head.next;

      let remove = removeCycle(head);
      console.log("Cycle Removed", remove);

      let cureent = head;

      while (cureent !== null) {
        console.log(cureent.value);
        cureent = cureent.next;
      }
    </script>
  </body>
</html>
