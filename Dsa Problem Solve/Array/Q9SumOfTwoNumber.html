<!DOCTYPE html>

  <body>
    <script>
      function TowsumofNumber(arr, target) {
        for (let i = 0; i < arr.length; i++) {
          for (let m = i + 1; m < arr.length; m++) {
            if (arr[i] + arr[m] === target) {
              return [arr[i], arr[m]];
            }
          }
        }
        return [];
      }
      console.log(TowsumofNumber([10, 20, 30, 40, 50],90));
    </script>
  </body>
