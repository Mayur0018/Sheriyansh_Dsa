<!DOCTYPE html>

  <head>

    <title>Document</title>

  <body>
    <script>
      function findMisingNumber(nums) {
        let map = new Map();
        for (let i = 0; i < nums.length; i++) {
          map.set(nums[i], 1);
        }
        for (let i = 0; i <= nums.length; i++) {
          if (!map.has(i)) {
            return i;
          }
        }
      }
      console.log(findMisingNumber([3,1]));
    </script>
  </body>
</html>
