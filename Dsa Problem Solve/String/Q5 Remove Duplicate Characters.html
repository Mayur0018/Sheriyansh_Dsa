<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str = "mayurr";
      let result = "";
      let seen = {};

      for (let i = 0; i < str.length; i++) {
        let char = str[i];

        if (!seen[char]) {
          result = result + char;
          seen[char] = true;
        }
      }
      console.log(result);
    </script>
  </body>
</html>
