<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str1 = "listen";
      let str2 = "silent";

      if (str1.length !== str2.length) {
        console.log("Not Anagram");
      } else {
        let frequency = {};
        for (let i = 0; i < str1.length; i++) {
          let char = str1[i];
          if (frequency[char]) {
            frequency[char]++;
          } else {
            frequency[char] = 1;
          }
        }
        //   decrese count using second thing

        for (let i = 0; i < str2.length; i++) {
          let char = str2[i];
          if (!frequency[char]) {
            console.log("Not Angram");
            break;
          }
          frequency[char]--;
        }
        console.log("Anagram");
        
      }
    </script>
  </body>
</html>
