<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [10, 20, 20, 20, 30, 40, 50];
      let target = 20;
      let left = 0;
      let right = arr.length - 1;
      let found = -1;
      while (left <= right) {
        let mid = Math.floor(left + right / 2);

        if (arr[mid] === target) {
          found = mid;
          right = mid - 1;
        } else if (arr[mid] < target) {
          left = mid + 1;
        } else {
          right = mid - 1;
        }

      }
      console.log("First occurrence:", found);
    </script>
  </body>
</html>
