<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Node {
        constructor(value) {
          this.value = value;
          this.next = null;
        }
      }
      class LinkedList {
        constructor() {
          this.head = null;
        }
        insert(value) {
          let newNode = new Node(value);

          if (this.head == null) {
            this.head = newNode;
            return;
          }

          let cuurent = this.head;
          while (cuurent.next !== null) {
            cuurent = cuurent.next;
          }
          cuurent.next = newNode;
        }
        serach(value) {
          let cureent = this.head;
          while (cureent !== null) {
            if (cureent.value === value) {
              return true;
            }
            cureent = cureent.next;
          }
          return false;
        }
      }

      let list = new LinkedList();
      list.insert(10);
      list.insert(20);
      list.insert(30);
      list.insert(40);
      list.insert(50);

      console.log(list.serach(30));
      console.log(list.serach(70));
    </script>
  </body>
</html>
