<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        function  SubArraywitHgivernSum(nums,target){
            let map = new Map();
            let sum = 0;

            for(let i = 0; i<nums.length; i++){
                sum = sum + nums[i];

                if(sum === target){
                    return [0,i];
                }

                let required = sum - target;
                if(map.has(required)){
                    return [map.get(required)+ 1,i]
                }
                map.set(sum,i)
            }
            return -1;
        }

        console.log(SubArraywitHgivernSum([1,2,3,7,5],12));
        
    </script>
</body>
</html>
