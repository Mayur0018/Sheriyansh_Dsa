<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Node {
        constructor(data) {
          this.data = data;
          this.next = null;
        }
      }
      let head = new Node(1);
      head.next = new Node(2);
      head.next.next = new Node(3);
      head.next.next.next = new Node(4);
      head.next.next.next.next = new Node(5);

      function findMidle(head) {
        let slow = head;
        let fast = head;

        while (fast != null && fast.next !== null) {
          slow = slow.next;
          fast = fast.next.next;
        }
        return slow;
      }

      let middle = findMidle(head);
      console.log("Middle Node");
      console.log(middle.data);
    </script>
  </body>
</html>
