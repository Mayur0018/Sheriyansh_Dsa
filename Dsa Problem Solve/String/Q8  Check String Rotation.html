<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function isrotaion(s1, s2) {
        if (s1.length !== s2.length) {
          return false;
        }
        let n = s1.length;

        for (let i = 0; i < n; i++) {
          let match = true;

          for (let j = 0; j < n; j++) {
            if (s1[(i + j) % n] !== s2[j]) {
              match = false;
              break;
            }
          }
          if (match) {
            return true;
          }
        }
        return false;
      }

      console.log(isrotaion("abcd", "cdab")); // true
    </script>
  </body>
</html>
