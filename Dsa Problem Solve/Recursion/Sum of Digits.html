<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function sumOfDigit(n) {
        if (n === 0) {
          return 0;
          return (n % 10) + sumOfDigit(Math.floor(n / 10));
        }
        console.log(sumOfDigit(1234));
      }
    </script>
  </body>
</html>
