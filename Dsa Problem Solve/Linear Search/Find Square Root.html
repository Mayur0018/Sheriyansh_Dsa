<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function squareRoot(n) {
        if (n < 0) {
          return -1;
        }

        let low = 0;
        let high = n;
        let ans = 0;

        while (low <= high) {
          let mid = (low + high) / 2;
          mid = mid - mid % 1;

          if (mid * mid === n) {
            return mid;
          } else if (mid * mid < n) {
            ans = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }
        return ans;
      }
      console.log(squareRoot(25));
      console.log(squareRoot(30));
      console.log(squareRoot(64));
      
    </script>
  </body>
</html>
