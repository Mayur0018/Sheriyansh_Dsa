  <body>
    <script>
      let num1 = [10, 20, 30, 40, 40, 50];
      let num2 = [10, 50, 60, 40];
      let result = [];

      for (let i = 0; i < num1.length; i++) {
        for (let j = 0; j < num2.length; j++) {
          if (num1[i] === num2[i]) {
            let alradyExist = false;

            for (let k = 0; k < result.length; k++) {
              if (result[k] === num1[i]) {
                alradyExist = true;
              }
            }
            if (alradyExist === false) {
              result[result.length] = num1[i];
            }
            break;
          }
        }
      }
      console.log(result)
    </script>
