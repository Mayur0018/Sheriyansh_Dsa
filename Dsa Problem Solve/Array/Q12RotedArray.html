<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function RotedArray(arr) {
        let k = 1;
        let n = arr.length;
        let result = new Array(n);
        for (let i = 0; i < arr.length; i++) {
          let newIndex = (i + k) % n;
          result[newIndex] = arr[i];
        }
        return result;
      }
      console.log(RotedArray([10, 20, 30, 40, 50, 60, 70]));
    </script>
  </body>
</html>
