<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function Permutations(str, current = "") {
        if (str.length == 0) {
          console.log(current);
          return;
        }
        for (let i = 0; i < str.length; i++) {
          let char = str[i];
          let remaning = str.slice(0, i) + str.slice(i + 1);
          Permutations(remaning, current + char);
        }
      }
      console.log(Permutations("abc"));
    </script>
  </body>
</html>
