<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function intersection(nums1, nums2) {
        let map = new Map();
        let result = [];
        for (let i = 0; i < nums1.length; i++) {
          map.set(nums1[i], 1);
        }
        for (let i = 0; i < nums2.length; i++) {
          let current = nums2[i];
          if (map.has(current)) {
            result[result.length] = current;
            map.delete(current);
          }
        }
        return result;
      }
      console.log(intersection([1, 2, 4, 5, 6], [3, 4, 5, 6, 7,2]));
    </script>
  </body>
</html>
