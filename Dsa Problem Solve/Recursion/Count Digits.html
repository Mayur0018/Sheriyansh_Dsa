<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function countDigit(n) {
        if (n === 0) {
          return 0;
        }
        return 1 + countDigit(Math.floor(n / 10));
      }
      console.log(countDigit(12345));
    </script>
  </body>
</html>
