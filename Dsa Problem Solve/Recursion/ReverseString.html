<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function reveseString(str, index) {
        if (index < 0) {
          return ";";
        }
        return str[index] + reveseString(str, index - 1);
      }
      let str = "Mayur";
      console.log(reveseString(str, str.length - 1));
    </script>
  </body>
</html>
