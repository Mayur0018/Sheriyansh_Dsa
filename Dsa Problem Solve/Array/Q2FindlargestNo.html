<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function LargestNumber(arr) {
        let largest = arr[0];
        for (let i = 1; i < arr.length; i++) {
          if (arr[i] > largest) {
            largest = arr[i];
          }
        }
        return largest;
      }

      console.log(LargestNumber([10, 20, 30, 40, 50]));
    </script>
  </body>
</html>
