<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Node {
        constructor(value) {
          this.value = value;
          this.next = null;
        }
      }

      function findNthFromEnd(head, n) {
        let fast = head;
        let slow = head;

        for (let i = 0; i < n; i++) {
          fast = fast.next;
        }
        while (fast !== null) {
          fast = fast.next;
          slow = slow.next;
        }
        return slow;
      }

      let head = new Node(1);
      head.next = new Node(2);
      head.next.next = new Node(3);
      head.next.next.next = new Node(4);
      head.next.next.next.next = new Node(5);

      let n = 2;
      let result = findNthFromEnd(head, n);
      console.log(result);
    </script>
  </body>
</html>
