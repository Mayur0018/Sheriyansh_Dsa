<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse Linked List</title>
  </head>

  <body>
    <script>
      class Node {
        constructor(data) {
          this.data = data;
          this.next = null;
        }
      }

      // Linked List create karo
      let head = new Node(1);

      head.next = new Node(2);
      head.next.next = new Node(3);

      // Reverse Linked List
      function reverseLinkedList(head) {
        let prv = null;
        let cureent = head;
        let next = null;

        while (cureent !== null) {
          next = cureent.next;

          cureent.next = prv;

          prv = cureent;

          cureent = next;
        }

        return prv;
      }

      // Print Linked List
      function printList(head) {
        let cureent = head;

        while (cureent !== null) {
          console.log(cureent.data);

          cureent = cureent.next;
        }
      }

      // Reverse karna zaroori hai
      head = reverseLinkedList(head);

      console.log("Reversed Linked List");

      printList(head);
    </script>
  </body>
</html>
