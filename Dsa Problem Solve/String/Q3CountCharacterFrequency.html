<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let str = "hello world";
      let frequency = {};

      for (let i = 0; i < str.length; i++) {
        let char = str[i];
        if (frequency[char] === undefined) {
          frequency[char] = 1;
        } else {
          frequency[char]++;
        }
      }
      console.log(frequency);
    </script>
  </body>
</html>
