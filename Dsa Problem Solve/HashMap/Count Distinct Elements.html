<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <script>
      function CountDistinctElements(nums) {
        let map = new Map();
        for (let i = 0; i < nums, length; i++) {
          if (map.has(nums[i])) {
            map.set(nums[i], 1);
          }
        }
        let count = 0;
        for (let [key, value] of map) {
          count++;
        }
        return count;
      }

      console.log(CountDistinctElements([1, 2, 2, 3, 1.4]));
    </script>
  </body>
