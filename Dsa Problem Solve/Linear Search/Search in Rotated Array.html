  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <script>
      let arr = [4, 5, 6, 7, 0, 1, 2];
      let target = 0;
      let answer = -1;

      for (let i = 0; i < arr.length; i++) {
        if (arr[i] === target) {
          answer = i;
          break;
        }
      }
      console.log(answer);
    </script>
